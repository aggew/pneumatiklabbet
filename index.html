<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8ecf0">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Pneumatiklabbet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — slim header, full-bleed schematic canvas (grid paper), bottom tool bar; sheets slide up over the canvas */
:root{
  --bg:#e8ecf0; --grid:#dbe1e7; --grid2:#c8d1da; --ink:#17222d; --muted:#5a6876; --panel:#fbfcfd; --line:#c3ccd5;
  --air:#1662cc; --accent:#d4621a; --danger:#b8352a; --ok:#2a8a5f; --wash:#dfe8f4; --warn:#d9a400;
  --s1:#1662cc; --s2:#d4621a; --s3:#2a8a5f; --s4:#8a4bc4; --s5:#b8325a;
  --shadow:rgba(20,32,46,.14);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --grid:#161f28; --grid2:#202c38; --ink:#d9e3ed; --muted:#8696a7; --panel:#141c25; --line:#2a3745;
  --air:#4ea2ff; --accent:#f08b3d; --danger:#ef6b5b; --ok:#4cc38a; --wash:#16283c; --warn:#f2c230;
  --s1:#4ea2ff; --s2:#f08b3d; --s3:#4cc38a; --s4:#b98cf0; --s5:#f06f95;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141a; --grid:#161f28; --grid2:#202c38; --ink:#d9e3ed; --muted:#8696a7; --panel:#141c25; --line:#2a3745;
  --air:#4ea2ff; --accent:#f08b3d; --danger:#ef6b5b; --ok:#4cc38a; --wash:#16283c; --warn:#f2c230;
  --s1:#4ea2ff; --s2:#f08b3d; --s3:#4cc38a; --s4:#b98cf0; --s5:#f06f95;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;padding-block:8px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:700 19px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;min-width:0;flex:1}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none;color:var(--air)}
.ctrls{display:flex;gap:6px;align-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:500 14px var(--f-body);cursor:pointer;touch-action:manipulation}
.btn:focus-visible,select:focus-visible,input:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.run{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.icon{width:36px;padding:0}
select.btn{padding:0 10px;appearance:none;-webkit-appearance:none;font-family:var(--f-mono);font-size:13px}
#stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#clock{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;font:500 12px var(--f-mono);color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border-top:1px solid var(--line);padding-block:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink);font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:7px 2px;border-radius:8px;cursor:pointer;touch-action:manipulation}
nav button[aria-pressed="true"]{color:var(--air);background:var(--wash)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 28px var(--shadow);padding-block:4px 18px;z-index:5;overscroll-behavior:contain}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 4px}
.sh-head{display:flex;align-items:flex-start;gap:8px;padding-block:4px 10px}
.sh-head .ttl{flex:1;min-width:0}
.eyebrow{font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{margin:2px 0 0;font:700 24px/1.05 var(--f-display);letter-spacing:.01em;text-wrap:balance}
h2 span{font-weight:500;color:var(--muted);font-size:18px}
h3{margin:16px 0 8px;font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px 14px;margin:0 0 12px;padding:10px 12px;background:var(--wash);border-radius:10px}
.ro div{min-width:0}
.ro dt{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ro dd{margin:1px 0 0;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.act{display:flex;gap:8px;margin:0 0 12px}
.act .btn{flex:1;height:52px;font:700 16px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#fff;border-color:var(--accent);user-select:none;-webkit-user-select:none;touch-action:none}
.act .btn.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.params{display:grid;gap:14px}
.prm{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}
.prm label{font:500 14px var(--f-body)}
.prm input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--air);height:28px;margin:0}
.pv{display:flex;align-items:center;gap:6px;font:500 13px var(--f-mono);color:var(--muted)}
.prm input:disabled{opacity:.55}
.pv input{width:82px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 14px var(--f-mono);padding:0 8px;text-align:right}
.prm select{grid-column:1/-1;width:100%;height:40px;font-family:var(--f-body);font-size:15px;text-align:left;justify-content:flex-start}
.foot{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.foot .btn{flex:1;min-width:120px;height:42px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:#fff}
.sheet.min .params,.sheet.min .foot{display:none}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.pal-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font:500 13px/1.2 var(--f-body);text-align:center;touch-action:manipulation}
.pal-item canvas{width:84px;height:56px}
.ex-list{display:grid;gap:8px}
.ex{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font:400 14px/1.35 var(--f-body)}
.ex b{font:700 18px var(--f-display);letter-spacing:.02em}
.ex span{color:var(--muted)}
.help{margin:0;padding-left:18px;max-width:62ch;color:var(--ink)}
.help li{margin:4px 0}
#graph{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));height:178px;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:3;display:grid;grid-template-rows:auto 1fr;box-shadow:0 6px 20px var(--shadow);overflow:hidden}
#legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:6px 10px 0;font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);min-height:20px}
#legend .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#legend .lg b{color:var(--ink);font-weight:500}
#legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.k0{background:var(--s1)}.k1{background:var(--s2)}.k2{background:var(--s3)}.k3{background:var(--s4)}.k4{background:var(--s5)}
#gcv{width:100%;height:100%;display:block;min-height:0}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:6;background:var(--ink);color:var(--panel);border-radius:999px;padding:6px 6px 6px 14px;font:500 14px var(--f-body);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 18px var(--shadow)}
#hint button{border:0;border-radius:999px;background:var(--panel);color:var(--ink);font:600 13px var(--f-body);padding:6px 12px;cursor:pointer}
#hint button[hidden]{display:none}
nav button.dk,.side,nav .sp{display:none}
.side-search{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 14px var(--f-body);padding:0 10px}
.side-list{flex:1;min-height:0;overflow:auto;padding-bottom:12px}
.side-list h3{margin:14px 0 6px}
.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-grid .pal-item{padding:6px 4px 8px;font-size:12px;cursor:grab}
.side-grid .pal-item:hover{border-color:var(--air);background:var(--wash)}
.side-grid .pal-item canvas{width:72px;height:48px}
.keys{border-top:1px solid var(--line);padding-block:10px;font:400 12px/1.6 var(--f-body);color:var(--muted)}
.keys kbd{font:500 11px var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
nav button:disabled{opacity:.4;cursor:default}
@media (hover:hover){nav button:not(:disabled):hover{background:var(--wash)}.btn:hover{border-color:var(--muted)}.ex:hover{border-color:var(--air)}}
@media (min-width:720px){
  .sheet{left:auto;right:12px;top:12px;bottom:auto;width:380px;border-radius:14px;border:1px solid var(--line);max-height:calc(100% - 24px);box-shadow:0 10px 30px var(--shadow)}
  .grab{display:none}
  #graph{top:auto;bottom:12px;right:auto;width:min(640px,calc(100% - 420px));min-width:300px}
  #clock{bottom:auto;top:10px}
}
@media (min-width:900px){
  #app{grid-template-columns:268px minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"side head" "side nav" "side stage"}
  header{grid-area:head} #stage{grid-area:stage}
  nav{grid-area:nav;display:flex;flex-wrap:wrap;gap:2px;border-top:0;border-bottom:1px solid var(--line);padding-block:4px}
  nav button{flex-direction:row;gap:6px;font-size:13px;padding:6px 10px}
  nav button.dk{display:flex} nav button.mb{display:none}
  nav .sp{display:block;flex:1}
  .side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-height:0;background:var(--panel);border-right:1px solid var(--line);padding:12px 14px 0 max(14px,env(safe-area-inset-left,0px))}
}
</style>

</head>
<body>
<div id="app">
  <header class="band">
    <div class="brand">
      <svg width="30" height="18" viewBox="0 0 30 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="3" width="17" height="12"/><rect x="9" y="4" width="3" height="10" fill="currentColor"/><line x1="12" y1="9" x2="29" y2="9"/></svg>
      <span>Pneumatiklabbet</span>
    </div>
    <div class="ctrls">
      <button id="play" class="btn run" aria-label="Pausa simuleringen"></button>
      <button id="reset" class="btn icon" aria-label="Nollställ tryck och lägen" title="Nollställ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
      </button>
      <select id="speed" class="btn" aria-label="Simuleringshastighet">
        <option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option><option value="0.1">0,1×</option>
      </select>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv" aria-label="Kretsschema"></canvas>
    <div id="graph" hidden><div id="legend"></div><canvas id="gcv"></canvas></div>
    <div id="hint" hidden><span id="hintText"></span><button id="hintBtn" type="button">Avbryt</button></div>
    <div id="clock">t = 0,00 s</div>
    <section id="sheet" class="sheet band" hidden aria-label="Egenskaper"></section>
    <section id="palette" class="sheet band" hidden aria-label="Lägg till komponent"></section>
    <section id="examples" class="sheet band" hidden aria-label="Exempel och hjälp"></section>
  </div>

  <nav class="band" aria-label="Verktyg">
    <button id="addBtn" class="mb" type="button" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>Komponent</button>
    <button id="graphBtn" type="button" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 20h18M4 16l5-6 4 3 7-8"/></svg>Graf</button>
    <button id="exBtn" type="button" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>Exempel</button>
    <button id="fitBtn" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Anpassa</button>
    <button id="zoomIn" class="dk" type="button" title="Zooma in (+)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg>Zooma in</button>
    <button id="zoomOut" class="dk" type="button" title="Zooma ut (−)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6"/></svg>Zooma ut</button>
    <span class="sp dk" aria-hidden="true"></span>
    <button id="undoBtn" class="dk" type="button" title="Ångra (Ctrl+Z)" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Ångra</button>
    <button id="redoBtn" class="dk" type="button" title="Gör om (Ctrl+Shift+Z)" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>Gör om</button>
  </nav>
  <aside class="side" aria-label="Komponenter">
    <div class="eyebrow">Komponenter · dra in eller klicka</div>
    <input id="sideSearch" class="side-search" type="search" placeholder="Sök, t.ex. ventil" aria-label="Sök komponent">
    <div id="sideList" class="side-list"></div>
    <div class="keys"><kbd>Mellanslag</kbd> kör/paus · <kbd>R</kbd> rotera · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicera · <kbd>Del</kbd> ta bort · <kbd>Ctrl</kbd>+<kbd>Z</kbd> ångra · <kbd>pilar</kbd> flytta · <kbd>F</kbd> anpassa · <kbd>G</kbd> graf · <kbd>+</kbd>/<kbd>−</kbd> zoom</div>
  </aside>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), g=cv.getContext('2d'), stage=$('#stage');
const gcv=$('#gcv'), gx=gcv.getContext('2d');
let W=0,H=0,DPR=Math.max(1,window.devicePixelRatio||1);
const view={ox:0,oy:0,z:1}; let viewTarget=null;
const KEY='pneumatiklabbet-v1';
const PV=0.01;           // liter per port (inre volym)
let DT=1e-4;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const F_LBL="600 12px 'Barlow Condensed','Arial Narrow',sans-serif";
const F_MONO="500 11px 'IBM Plex Mono',ui-monospace,monospace";

/* ---------- tema ---------- */
const C={};
let onTheme=null;
function readTheme(){const cs=getComputedStyle(document.documentElement);for(const k of ['warn','bg','grid','grid2','ink','muted','panel','line','air','accent','danger','ok','s1','s2','s3','s4','s5'])C[k]=cs.getPropertyValue('--'+k).trim();mixCache.clear();if(onTheme)onTheme();}
const mixCache=new Map();
function hx(s){s=s.replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');return[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}
function mix(a,b,t){t=Math.round(t*40)/40;const k=a+b+t;let v=mixCache.get(k);if(v)return v;const A=hx(a),B=hx(b);v=`rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;mixCache.set(k,v);return v;}
function pcol(p){if(!(p>0.03))return C.muted;return mix(C.muted,C.air,0.35+0.65*clamp(p/7,0,1));}
readTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readTheme,0));}catch(_){}
new MutationObserver(()=>readTheme()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});

/* ---------- modell ---------- */
let comps=[],hoses=[],nextId=1,idMap=new Map();
let running=true,speed=1,simT=0,tw=0;
const portPg=new Map();
let nets=[],Vn=new Float64Array(0),Pn=new Float64Array(0),Dn=new Float64Array(0);
let dirty=true;
const key=(c,p)=>c+':'+p;
const isValve=c=>c.type==='v32'||c.type==='v52'||c.type==='v53';
const isCyl=c=>c.type==='cylD'||c.type==='cylS';
function reindex(){idMap=new Map(comps.map(c=>[c.id,c]));}
const byId=id=>idMap.get(id);
function pa(n){return(n===undefined||n<0)?1:Pn[n];}
function pg(c,pid){const n=c.pn&&c.pn[pid];if(n===undefined||n<0||n>=Pn.length)return 0;return Pn[n]-1;}
const f2=v=>(Math.abs(v)<0.005?0:v).toFixed(2).replace('.',',');
const f1=v=>(+v).toFixed(1).replace('.',',');
const fq=q=>Math.round(Math.max(0,q)*60)+' NL/min';

/* flöde enligt förenklad ISO 6358: q = C·p1·φ(p2/p1), b = 0,5 */
function phi(r){if(r<=0.5)return 1;const t=(r-0.5)/0.5;return Math.sqrt(Math.max(0,1-t*t));}
function flow(a,b,p1,p2,Cc,oneway){
  if(!(Cc>0)||(a<0&&b<0)||(a===b))return 0;
  let q;
  if(p1>=p2)q=Cc*p1*phi(p2/p1);
  else{if(oneway)return 0;q=-Cc*p2*phi(p1/p2);}
  let dn=q*DT;
  const Va=a<0?0:Vn[a],Vb=b<0?0:Vn[b];
  const Ve=a<0?Vb:b<0?Va:Va*Vb/(Va+Vb);
  const lim=Math.abs(p1-p2)*Ve*0.5;
  if(dn>lim)dn=lim;else if(dn<-lim)dn=-lim;
  if(a>=0)Dn[a]-=dn;if(b>=0)Dn[b]+=dn;
  return dn/DT;
}

/* ---------- ritverktyg ---------- */
function ln(x,a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();}
function circ(x,cx,cy,r,fill){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}x.stroke();}
function box(x,a,b,w,h,fill){if(fill){x.fillStyle=fill;x.fillRect(a,b,w,h);}x.strokeRect(a,b,w,h);}

/* ---------- geometri ---------- */
function rotP(x,y,r){switch(r&3){case 0:return[x,y];case 1:return[-y,x];case 2:return[-x,-y];default:return[y,-x];}}
function portWorld(c,pid){const p=portDef(c.type,pid);const[a,b]=rotP(p.x,p.y,c.rot);const[dx,dy]=rotP(p.dx,p.dy,c.rot);return{x:c.x+a,y:c.y+b,dx,dy};}
function toLocal(c,w){return rotP(w.x-c.x,w.y-c.y,(4-c.rot)&3);}
function wb(c,mode){const t=T[c.type];let[x0,y0,x1,y1]=mode==='label'&&t.lbox?t.lbox:t.box;if(mode==='fit'&&isCyl(c))x1+=(c.params.grav==='yes'?160:110);if(mode==='fit'&&c.type==='wall'){y1+=(c.params.rp/c.params.r1)*120+40;x0-=60;x1+=60;}
  let a=1e9,b=1e9,d=-1e9,e=-1e9;for(const[p,q]of[[x0,y0],[x1,y0],[x0,y1],[x1,y1]]){const[u,v]=rotP(p,q,c.rot);a=Math.min(a,u);b=Math.min(b,v);d=Math.max(d,u);e=Math.max(e,v);}return[a+c.x,b+c.y,d+c.x,e+c.y];}
function hoseGeom(h){const A=portWorld(byId(h.a.c),h.a.p),B=portWorld(byId(h.b.c),h.b.p);const d=Math.hypot(B.x-A.x,B.y-A.y),k=clamp(d*0.45,18,90);return[A.x,A.y,A.x+A.dx*k,A.y+A.dy*k,B.x+B.dx*k,B.y+B.dy*k,B.x,B.y];}
function hoseLen(h){const A=portWorld(byId(h.a.c),h.a.p),B=portWorld(byId(h.b.c),h.b.p);return Math.hypot(B.x-A.x,B.y-A.y)*1.2/200;}

/* ---------- bygg nät ---------- */
function build(){
  reindex();
  const par=new Map(),cnt=new Map();
  const find=k=>{let r=k;while(par.get(r)!==r)r=par.get(r);while(par.get(k)!==r){const n=par.get(k);par.set(k,r);k=n;}return r;};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par.set(a,b);};
  for(const c of comps)for(const p of T[c.type].ports){const k=key(c.id,p.id);par.set(k,k);}
  hoses=hoses.filter(h=>par.has(key(h.a.c,h.a.p))&&par.has(key(h.b.c,h.b.p)));
  for(const h of hoses){const a=key(h.a.c,h.a.p),b=key(h.b.c,h.b.p);uni(a,b);cnt.set(a,(cnt.get(a)||0)+1);cnt.set(b,(cnt.get(b)||0)+1);}
  for(const c of comps){const t=T[c.type];if(t.join){const ps=t.ports;for(let i=1;i<ps.length;i++)uni(key(c.id,ps[0].id),key(c.id,ps[i].id));}}
  const ri=new Map();nets=[];
  for(const c of comps){c.pn={};if(isCyl(c))c._g=geo(c);
    if(c.type==='v52')c._auto=c.params.auto?comps.find(k=>String(k.id)===String(c.params.auto)&&isCyl(k))||null:null;
    for(const p of T[c.type].ports){const k=key(c.id,p.id);
      if(p.exh&&!cnt.get(k)){c.pn[p.id]=-1;continue;}
      const r=find(k);let i=ri.get(r);if(i===undefined){i=nets.length;ri.set(r,i);nets.push({base:0.02,keys:[],cyl:[],n:0});}
      c.pn[p.id]=i;nets[i].keys.push(k);nets[i].base+=PV;}}
  for(const h of hoses){nets[byId(h.a.c).pn[h.a.p]].base+=0.028*Math.max(0.2,hoseLen(h));}
  for(const c of comps){if(c.type==='tank')nets[c.pn.T].base+=c.params.vol;
    if(c.type==='cylD'){nets[c.pn.A].cyl.push([c,0]);nets[c.pn.B].cyl.push([c,1]);}
    if(c.type==='cylS')nets[c.pn.A].cyl.push([c,0]);}
  for(const c of comps)if(c.type==='regulator'){c._cyl=c.params.ctl==='auto'?comps.find(k=>String(k.id)===String(c.params.cyl)&&isCyl(k))||null:null;c._side=c._cyl&&c._cyl.type==='cylD'?(c._cyl.pn.A===c._cyl.pn.B?'D':c.pn.OUT===c._cyl.pn.B?'B':'A'):'A';}
  for(const c of comps)if(isCyl(c))c._wall=null;
  for(const c of comps)if(c.type==='wall'){const f=id=>comps.find(k=>String(k.id)===String(id)&&isCyl(k))||null;const a=f(c.params.c1),b=f(c.params.c2);
    if(a&&b&&a!==b&&!a._wall&&!b._wall){c._c1=a;c._c2=b;a._wall=c;b._wall=c;const M=wallMax(c);if(c.st.phi==null)c.st.phi=0;c.st.phi=clamp(c.st.phi,-M,M);wallSet(c);}else{c._c1=c._c2=null;}}
  for(const c of comps)c._zone=c.params.zone?comps.find(k=>String(k.id)===String(c.params.zone)&&k.type==='zone')||null:null;
  const N=nets.length;Vn=new Float64Array(N);Pn=new Float64Array(N);Dn=new Float64Array(N);
  for(let i=0;i<N;i++){const nt=nets[i];let s=0;for(const k of nt.keys)s+=(portPg.get(k)||0);const p=Math.max(0.02,(nt.keys.length?s/nt.keys.length:0)+1);Vn[i]=netVol(i);Pn[i]=p;nt.n=p*Vn[i];}
  dirty=false;
}
function netVol(i){const nt=nets[i];let v=nt.base;for(const[c,s]of nt.cyl)v+=cylV(c,s);return v;}

function step(dt){
  DT=dt;const N=nets.length;
  for(let i=0;i<N;i++){Vn[i]=netVol(i);Pn[i]=nets[i].n/Vn[i];Dn[i]=0;}
  for(const c of comps){const t=T[c.type];if(t.edges)t.edges(c);}
  for(let i=0;i<N;i++){const nt=nets[i];nt.n=Math.max(1e-4*Vn[i],nt.n+Dn[i]);}
  for(const c of comps){if(isCyl(c)){if(c._wall)cylNet(c);else cylDyn(c,dt);}else if(c.type==='v52'&&c._auto)autoValve(c);}
  for(const c of comps)if(c.type==='wall'&&c._c1)wallDyn(c,dt);
  simT+=dt;
}
function autoValve(c){const cy=c._auto,G=cy._g,f=G.L>0?cy.st.x/G.L:0;
  if(f>=0.995&&c.st.last!=='out'){c.st.last='out';c.st.pos=1-c.st.pos;}
  else if(f<=0.005&&c.st.last!=='in'){c.st.last='in';c.st.pos=1-c.st.pos;}}
function initSt(c){const st={q:0,qs:0,open:0,ex:{},exs:{}};if(isValve(c)){st.pos=1;st.anim=1;st.last='';}if(isCyl(c)){st.x=0;st.v=0;st.Fp=0;st.F=0;}if(T[c.type].toggle)st.on=true;if(c.type==='wall'){st.phi=null;st.v=0;st.hits=0;st.pulse=0;st.timer=0;}c.st=st;}

/* ---------- manövrering ---------- */
function actPress(c,side){if(T[c.type].toggle||T[c.type].tap)return;if(c.params.mode==='hold'){c.st.pos=side==='R'?2:0;c.st.held=true;}}
function actRelease(c,side){if(T[c.type].tap){T[c.type].tap(c);return;}if(T[c.type].toggle){c.st.on=!c.st.on;return;}if(c.params.mode==='hold'){c.st.pos=1;c.st.held=false;}else{const t=side==='R'?2:0;c.st.pos=c.st.pos===t?1:t;}}
function actCancel(c){if(T[c.type].toggle||T[c.type].tap)return;if(c.params.mode==='hold'){c.st.pos=1;c.st.held=false;}}

/* ---------- komponenter skapa / ta bort ---------- */
function newComp(type,x,y,params={},rot=0){const t=T[type];let max=0;for(const c of comps)if(T[c.type].short===t.short){const n=parseInt(c.label.slice(t.short.length))||0;max=Math.max(max,n);}
  const c={id:nextId++,type,x,y,rot,params:{...t.def,...params},label:t.short+(max+1)};initSt(c);return c;}
const isWide=()=>matchMedia('(min-width:720px)').matches;
function addComp(type,at,params,rot){const w=at||toW(isWide()?Math.min(W/2,W-430):W/2,isWide()?H/2:Math.max(80,(H-(sheetVisible()?sheetHeight():0))/2));let x=snap(w.x),y=snap(w.y);
  while(comps.some(c=>Math.abs(c.x-x)<30&&Math.abs(c.y-y)<30))y+=50;
  const c=newComp(type,x,y,params||{},rot||0);comps.push(c);reindex();dirty=true;save();select({t:'c',id:c.id});}
function delComp(c){comps=comps.filter(k=>k!==c);hoses=hoses.filter(h=>h.a.c!==c.id&&h.b.c!==c.id);for(const k of comps)if(k.params.auto===String(c.id))k.params.auto='';reindex();dirty=true;save();select(null);}
function addHose(a,b){if(a.c===b.c&&a.p===b.p)return;if(hoses.some(h=>(h.a.c===a.c&&h.a.p===a.p&&h.b.c===b.c&&h.b.p===b.p)||(h.a.c===b.c&&h.a.p===b.p&&h.b.c===a.c&&h.b.p===a.p))){flash('Den slangen finns redan');return;}
  hoses.push({id:nextId++,a:{c:a.c,p:a.p},b:{c:b.c,p:b.p}});dirty=true;save();flash('Slang kopplad');}
const snap=v=>Math.round(v/10)*10;

/* ---------- spara ---------- */
let saveT=0;
const snapshot=()=>JSON.stringify({v:1,nextId,comps:comps.map(c=>({id:c.id,type:c.type,x:c.x,y:c.y,rot:c.rot,params:c.params,label:c.label})),hoses});
let hist=[],hidx=-1,recPending=false;
function record(){const sn=snapshot();if(hist[hidx]===sn)return;hist=hist.slice(0,hidx+1);hist.push(sn);if(hist.length>120)hist.shift();hidx=hist.length-1;updUndo();}
function updUndo(){const u=$('#undoBtn'),r=$('#redoBtn');if(u)u.disabled=hidx<=0;if(r)r.disabled=hidx>=hist.length-1;}
function restore(sn){const d=JSON.parse(sn);const old=new Map(comps.map(c=>[c.id,c.st]));
  comps=d.comps.filter(c=>T[c.type]).map(c=>{const k={...c,params:{...T[c.type].def,...c.params}};initSt(k);if(old.has(k.id)&&old.get(k.id))k.st=old.get(k.id);return k;});
  hoses=d.hoses;nextId=d.nextId;reindex();dirty=true;cancelConnect();select(null);closeAll();save(true);updUndo();}
function undo(){if(hidx>0){hidx--;restore(hist[hidx]);flash('Ångrat');}}
function redo(){if(hidx<hist.length-1){hidx++;restore(hist[hidx]);flash('Gjort om');}}
function save(noRec){if(!noRec)recPending=true;clearTimeout(saveT);saveT=setTimeout(()=>{if(recPending){recPending=false;record();}try{localStorage.setItem(KEY,snapshot());}catch(_){}},400);}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s||s.v!==1||!Array.isArray(s.comps))return false;
  comps=s.comps.filter(c=>T[c.type]).map(c=>{const k={...c,params:{...T[c.type].def,...c.params}};initSt(k);return k;});hoses=(s.hoses||[]).filter(h=>h&&h.a&&h.b);nextId=s.nextId||1;
  for(const c of comps)nextId=Math.max(nextId,c.id+1);for(const h of hoses)nextId=Math.max(nextId,h.id+1);reindex();return true;}catch(_){return false;}}

/* ---------- träffytor ---------- */
function hitAct(w){const r=Math.max(16,22/view.z);for(let i=comps.length-1;i>=0;i--){const c=comps[i];const t=T[c.type];if(!isValve(c)&&!t.acts)continue;const[lx,ly]=toLocal(c,w);for(const a of(isValve(c)?actPos(c):t.acts(c)))if(Math.hypot(lx-a.x,ly-a.y)<r)return{c,side:a.side};}return null;}

/* ---------- pekare ---------- */
const ptrs=new Map();let pinch=null;

});

});
function endPtr(e,cancel){const pt=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(!pt)return;

function cancelConnect(){if(connectFrom){connectFrom=null;hideHint();}}
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  if((e.key==='Delete'||e.key==='Backspace')&&selS){e.preventDefault();if(selS.t==='c'){const c=byId(selS.id);if(c)delComp(c);}else{hoses=hoses.filter(h=>h.id!==selS.id);dirty=true;save();select(null);}}
  if(e.key==='Escape'){cancelConnect();select(null);closeAll();}
  if(e.key===' '&&!e.repeat){e.preventDefault();togglePlay();}
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),sc=selS&&selS.t==='c'?byId(selS.id):null;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='d'&&sc){e.preventDefault();addComp(sc.type,{x:sc.x+40,y:sc.y+40},{...sc.params},sc.rot);return;}
  if(mod)return;
  if(k==='r'&&sc){sc.rot=(sc.rot+1)&3;dirty=true;save();}
  else if(k==='f')fit();
  else if(k==='g')$('#graphBtn').click();
  else if(k==='+'||k==='=')zoomBy(1.25);
  else if(k==='-')zoomBy(0.8);
  else if(sc&&e.key.startsWith('Arrow')){e.preventDefault();const st=e.shiftKey?50:10;if(e.key==='ArrowLeft')sc.x-=st;if(e.key==='ArrowRight')sc.x+=st;if(e.key==='ArrowUp')sc.y-=st;if(e.key==='ArrowDown')sc.y+=st;dirty=true;save();}});
function zoomBy(f){viewTarget=null;const cx=W/2,cy=H/2,w=toW(cx,cy);view.z=clamp(view.z*f,0.25,4);view.ox=cx-w.x*view.z;view.oy=cy-w.y*view.z;}

/* ---------- tips ---------- */
const hintEl=$('#hint'),hintText=$('#hintText'),hintBtn=$('#hintBtn');let hintT=0;
function hint(t,cancelable){clearTimeout(hintT);hintText.textContent=t;hintBtn.hidden=!cancelable;hintEl.hidden=false;}
function hideHint(){hintEl.hidden=true;}
function flash(t){hint(t,false);hintT=setTimeout(hideHint,1300);}
hintBtn.addEventListener('click',()=>{cancelConnect();rubber=null;});

/* ---------- ark ---------- */
const sheet=$('#sheet'),palette=$('#palette'),examples=$('#examples');let sheetMin=false;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function sheetVisible(){return!sheet.hidden||!palette.hidden||!examples.hidden;}
function sheetHeight(){for(const s of[sheet,palette,examples])if(!s.hidden)return s.getBoundingClientRect().height;return 0;}
function closeAll(keepSel){sheet.hidden=true;palette.hidden=true;examples.hidden=true;$('#addBtn').setAttribute('aria-pressed','false');$('#exBtn').setAttribute('aria-pressed','false');if(!keepSel)selS=null;}
function select(s,silent){selS=s;if(!s){sheet.hidden=true;return;}if(silent)return;
  if(s.t==='c'){const c=byId(s.id);if(c)openComp(c);}else{const h=hoses.find(k=>k.id===s.id);if(h)openHose(h);}}
function keepVisible(wx,wy){requestAnimationFrame(()=>{const sh=sheetHeight();const sy=wy*view.z+view.oy;const sx=wx*view.z+view.ox;const lim=H-sh-50;let ty=view.oy,tx=view.ox;
  if(isWide()){if(sx>W-420||sx<30)tx=view.ox+((W-400)/2-sx);}else if(sy>lim||sy<40)ty=view.oy+((H-sh)/2-sy);if(ty!==view.oy||tx!==view.ox)viewTarget={ox:tx,oy:ty};});}
function head(eyebrow,title,sub){return`<div class="grab" aria-hidden="true"></div><div class="sh-head"><div class="ttl"><div class="eyebrow">${eyebrow}</div><h2>${title} ${sub?`<span>${sub}</span>`:''}</h2></div>
  <button class="btn icon" data-min aria-label="Minimera">${sheetMin?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 15l6-6 6 6"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>'}</button>
  <button class="btn icon" data-close aria-label="Stäng"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;}
function wireHead(el,reopen){el.querySelector('[data-close]').onclick=()=>{select(null);closeAll();};const m=el.querySelector('[data-min]');if(m)m.onclick=()=>{sheetMin=!sheetMin;reopen();};}
let roComp=null;
function openComp(c){palette.hidden=true;examples.hidden=true;$('#addBtn').setAttribute('aria-pressed','false');$('#exBtn').setAttribute('aria-pressed','false');
  const t=T[c.type];roComp=c;sheet.className='sheet band'+(sheetMin?' min':'');
  sheet.innerHTML=head(t.cat,esc(c.label),t.name)+`<dl class="ro" id="ro"></dl><div class="act" id="actBox"></div><div class="params" id="prm"></div>
   <div class="foot"><button class="btn" id="rotBtn" type="button">Rotera 90°</button><button class="btn danger" id="delBtn" type="button">Ta bort</button></div>`;
  wireHead(sheet,()=>openComp(c));
  const pb=sheet.querySelector('#prm');
  for(const p of t.params){const id=`p${c.id}-${p.k}`;const row=document.createElement('div');row.className='prm';
    if(p.t==='range'){row.innerHTML=`<label for="${id}">${p.label}</label><div class="pv"><input type="number" id="${id}n" inputmode="decimal" step="${p.step}" min="${p.min}" max="${p.max}" value="${c.params[p.k]}" aria-label="${p.label}"><span>${p.unit}</span></div><input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${c.params[p.k]}">`;
      const r=row.querySelector('input[type=range]'),n=row.querySelector('input[type=number]');
      r.addEventListener('input',()=>{setParam(c,p,+r.value);n.value=c.params[p.k];});
      n.addEventListener('change',()=>{setParam(c,p,parseFloat(String(n.value).replace(',','.')));n.value=c.params[p.k];r.value=c.params[p.k];});}
    else{const opts=typeof p.opts==='function'?p.opts(c):p.opts;row.innerHTML=`<label for="${id}">${p.label}</label><select class="btn" id="${id}">${opts.map(([v,l])=>`<option value="${esc(v)}"${String(c.params[p.k])===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
      row.querySelector('select').addEventListener('change',ev=>{c.params[p.k]=ev.target.value;if(p.k==='auto')c.st.last='';c.st.I=0;if(p.k==='ctl'||p.k==='cyl'){dirty=true;save();openComp(c);return;}if(p.k==='mode'){c.st.pos=1;renderActs(c);}dirty=true;save();});}
    pb.appendChild(row);}
  if(c.type==='regulator'&&c.params.ctl==='auto')pb.querySelectorAll(`#p${c.id}-set,#p${c.id}-setn`).forEach(i=>i.disabled=true);
  if(c.type==='regulator'&&c.params.ctl!=='auto')pb.querySelectorAll(`#p${c.id}-cyl,#p${c.id}-target,#p${c.id}-targetn`).forEach(i=>i.closest('.prm').hidden=true);
  sheet.querySelector('#rotBtn').onclick=()=>{c.rot=(c.rot+1)&3;dirty=true;save();};
  const db=sheet.querySelector('#delBtn');let armT=0;db.onclick=()=>{if(db.classList.contains('arm')){clearTimeout(armT);delComp(c);}else{db.classList.add('arm');db.textContent='Tryck igen för att ta bort';armT=setTimeout(()=>{db.classList.remove('arm');db.textContent='Ta bort';},2500);}};
  renderActs(c);sheet.hidden=false;updateRO();keepVisible(c.x,c.y);}
function renderActs(c){const box=sheet.querySelector('#actBox');if(!box)return;box.innerHTML='';const tt=T[c.type];
  if(tt.tap){box.hidden=false;const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Skicka en planka';b.onclick=()=>tt.tap(c);box.appendChild(b);return;}
  if(isCyl(c)){box.hidden=false;const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Knuffa lasten';b.onclick=()=>{c.st.v-=Math.min(1,0.3+c.params.stroke/1000);};box.appendChild(b);return;}
  if(tt.toggle){box.hidden=false;const b=document.createElement('button');b.className='btn';b.type='button';b.dataset.tg='1';b.textContent=tt.toggleLabel(c);b.onclick=()=>{actRelease(c,'L');b.textContent=tt.toggleLabel(c);};box.appendChild(b);return;}if(!isValve(c)){box.hidden=true;return;}box.hidden=false;
  const sides=c.type==='v53'?[['L','◂ Vänster'],['R','Höger ▸']]:[['L',c.params.mode==='hold'?'Håll inne':'Växla läge']];
  for(const[side,label]of sides){const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=label;b.dataset.side=side;
    if(c.params.mode==='hold'){b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}actPress(c,side);});
      b.addEventListener('pointerup',()=>actRelease(c,side));b.addEventListener('pointercancel',()=>actCancel(c));b.addEventListener('contextmenu',e=>e.preventDefault());
      b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();actPress(c,side);}});b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')actRelease(c,side);});}
    else b.addEventListener('click',()=>actRelease(c,side));
    box.appendChild(b);}}
function setParam(c,p,v){if(!isFinite(v))return;v=clamp(Math.round(v/p.step)*p.step,p.min,p.max);v=+v.toFixed(4);c.params[p.k]=v;
  if(isCyl(c)&&(p.k==='bore'||p.k==='rod')&&c.params.rod>=c.params.bore-1){if(p.k==='bore'){c.params.rod=Math.max(3,Math.round(c.params.bore*0.4));const r=sheet.querySelector(`#p${c.id}-rod`),n=sheet.querySelector(`#p${c.id}-rodn`);if(r)r.value=c.params.rod;if(n)n.value=c.params.rod;}else c.params.rod=c.params.bore-2;}
  dirty=true;save();}
function openHose(h){palette.hidden=true;examples.hidden=true;roComp=null;sheet.className='sheet band';const ca=byId(h.a.c),cb=byId(h.b.c);
  sheet.innerHTML=head('Slang',`${esc(ca.label)}.${esc(h.a.p)} → ${esc(cb.label)}.${esc(h.b.p)}`,'')+`<dl class="ro" id="ro"></dl><div class="foot"><button class="btn danger" id="delH" type="button">Ta bort slang</button></div>`;
  wireHead(sheet,()=>openHose(h));sheet.querySelector('#delH').onclick=()=>{hoses=hoses.filter(k=>k!==h);dirty=true;save();select(null);};
  sheet.hidden=false;updateRO();}
function updateRO(){const ro=sheet.hidden?null:sheet.querySelector('#ro');if(ro&&selS){let rows=[];
    if(selS.t==='c'){const c=byId(selS.id);if(!c)return;rows=T[c.type].info?T[c.type].info(c):[];
      const ab=sheet.querySelectorAll('#actBox .btn');if(c.type==='regulator'&&c._cyl){const v=+(c.st.set||0).toFixed(2);const rr=sheet.querySelector(`#p${c.id}-set`),nn=sheet.querySelector(`#p${c.id}-setn`);if(rr)rr.value=v;if(nn)nn.value=v;}
      ab.forEach(b=>{if(b.dataset.tg){b.textContent=T[c.type].toggleLabel(c);return;}const s=b.dataset.side;b.classList.toggle('on',c.st.pos===(s==='R'?2:0));});}
    else{const h=hoses.find(k=>k.id===selS.id);if(!h)return;rows=[['Tryck',f2(pg(byId(h.a.c),h.a.p))+' bar'],['Längd ca',f1(hoseLen(h))+' m'],['Innerdiameter','6 mm']];}
    ro.innerHTML=rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');}
  updateLegend();$('#clock').textContent='t = '+simT.toFixed(2).replace('.',',')+' s'+(running?'':' · pausad');}

/* palett */
function drawIcon(cnv,type){const r=2;cnv.width=84*r;cnv.height=56*r;const x=cnv.getContext('2d');x.setTransform(r,0,0,r,0,0);
  const fake={type,params:{...T[type].def},pn:{},rot:0,st:null};initSt(fake);if(isCyl(fake))fake._g=geo(fake);
  let[x0,y0,x1,y1]=T[type].box;if(isCyl(fake))x1+=60;if(isValve(fake)){x0=type==='v53'?-120:-112;x1=type==='v53'?120:96;y0=-38;y1=38;}
  const s=Math.min(76/(x1-x0),48/(y1-y0),1.3);x.translate(42-(x0+x1)/2*s,28-(y0+y1)/2*s);x.scale(s,s);x.lineWidth=2;x.strokeStyle=C.ink;x.lineJoin='round';T[type].draw(x,fake);
  for(const p of T[type].ports){if(p.exh)continue;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fillStyle=C.muted;x.fill();}}
function openPalette(){if(!palette.hidden){closeAll(true);return;}closeAll();select(null,true);
  palette.innerHTML=head('Lägg till','Komponent','')+CATS.map(([cat,types])=>`<h3>${cat}</h3><div class="pal-grid">${types.map(t=>`<button class="pal-item" type="button" data-t="${t}"><canvas aria-hidden="true"></canvas>${T[t].name}</button>`).join('')}</div>`).join('');
  palette.querySelectorAll('.pal-item').forEach(b=>{drawIcon(b.querySelector('canvas'),b.dataset.t);b.onclick=()=>{closeAll();addComp(b.dataset.t);};});
  palette.querySelector('[data-close]').onclick=()=>closeAll();const m=palette.querySelector('[data-min]');m.remove();
  palette.hidden=false;$('#addBtn').setAttribute('aria-pressed','true');}
function openExamples(){if(!examples.hidden){closeAll(true);return;}closeAll();select(null,true);
  examples.innerHTML=head('Kom igång','Exempel','')+`<div class="ex-list">${EX.map((e,i)=>`<button class="ex" type="button" data-i="${i}"><b>${e.name}</b><span>${e.desc}</span></button>`).join('')}
    <button class="ex" type="button" id="clearAll"><b>Tom arbetsyta</b><span>Börja om från ett tomt schema.</span></button></div>
    <h3>Så gör du</h3><ul class="help">
    <li>Lägg till delar med <b>Komponent</b>. Dra en del för att flytta den, tryck på den för inställningar.</li>
    <li>Tryck på en port (pricken) och sedan på en annan för att dra en slang. Du kan också dra direkt från port till port. Flera slangar får gå från samma port, eller använd en T-koppling eller korskoppling.</li>
    <li>Snabbkopplingar och kulventiler öppnas och stängs med den runda knappen bredvid symbolen.</li>
    <li>En säkerhetszon styr kulventiler (stänger) och säkerhetsventiler (tömmer) som du kopplar till den i deras inställningar.</li>
    <li>Tryck på den runda knappen på en ventil för att manövrera den. Fjäderåtergång betyder att du håller inne.</li>
    <li>Lediga avloppsportar (R och S) blåser ut i det fria. Andra lediga portar är pluggade.</li>
    <li>Tryck anges som övertryck i bar. Slangarna blir blåare ju högre tryck de har.</li>
    <li>Nyp för att zooma och dra i en tom yta för att flytta vyn. Kör i ¼× eller 0,1× för att se förloppet i slow motion.</li></ul>`;
  examples.querySelectorAll('.ex[data-i]').forEach(b=>b.onclick=()=>{closeAll();loadExample(EX[+b.dataset.i]);});
  const ca=examples.querySelector('#clearAll');let armT=0;ca.onclick=()=>{if(ca.dataset.arm){clearTimeout(armT);closeAll();loadExample(null);}else{ca.dataset.arm='1';ca.querySelector('b').textContent='Tryck igen för att rensa allt';armT=setTimeout(()=>{delete ca.dataset.arm;ca.querySelector('b').textContent='Tom arbetsyta';},2500);}};
  examples.querySelector('[data-close]').onclick=()=>closeAll();examples.querySelector('[data-min]').remove();
  examples.hidden=false;$('#exBtn').setAttribute('aria-pressed','true');}

/* ---------- kontroller ---------- */
const playBtn=$('#play');
function drawPlay(){playBtn.innerHTML=running?'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>Paus':'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>Kör';
  playBtn.classList.toggle('run',running);playBtn.setAttribute('aria-label',running?'Pausa simuleringen':'Starta simuleringen');}
function togglePlay(){running=!running;drawPlay();}
playBtn.onclick=togglePlay;
$('#reset').onclick=()=>{resetSim();flash('Tryck och lägen nollställda');};
$('#speed').onchange=e=>{speed=+e.target.value;};
$('#addBtn').onclick=()=>{cancelConnect();openPalette();};
$('#exBtn').onclick=()=>{cancelConnect();openExamples();};
$('#fitBtn').onclick=()=>fit();
$('#zoomIn').onclick=()=>zoomBy(1.25);$('#zoomOut').onclick=()=>zoomBy(0.8);$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
const sideList=$('#sideList'),sideSearch=$('#sideSearch');
function buildSide(){const q=sideSearch.value.trim().toLowerCase();
  sideList.innerHTML=CATS.map(([cat,types])=>{const ts=types.filter(t=>!q||T[t].name.toLowerCase().includes(q)||cat.toLowerCase().includes(q));return ts.length?`<h3>${cat}</h3><div class="side-grid">${ts.map(t=>`<button class="pal-item" type="button" draggable="true" data-t="${t}" title="Dra till schemat eller klicka"><canvas aria-hidden="true"></canvas>${T[t].name}</button>`).join('')}</div>`:'';}).join('')||'<p class="keys">Ingen komponent matchar.</p>';
  sideList.querySelectorAll('.pal-item').forEach(b=>{drawIcon(b.querySelector('canvas'),b.dataset.t);b.onclick=()=>addComp(b.dataset.t);
    b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','pnl:'+b.dataset.t);e.dataTransfer.effectAllowed='copy';});});}
sideSearch.addEventListener('input',buildSide);
cv.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
cv.addEventListener('drop',e=>{e.preventDefault();const d=e.dataTransfer.getData('text/plain')||'';if(!d.startsWith('pnl:'))return;const t=d.slice(4);if(!T[t])return;const s=sxy(e);const w=toW(s.x,s.y);addComp(t,{x:w.x,y:w.y});});
onTheme=()=>{if(sideList.childElementCount)buildSide();};
buildSide();
$('#graphBtn').onclick=()=>{graphOpen=!graphOpen;$('#graph').hidden=!graphOpen;$('#graphBtn').setAttribute('aria-pressed',String(graphOpen));updateLegend();};
drawPlay();

/* ---------- loop ---------- */
let last=performance.now(),roT=0;
function frame(now){
  const dtr=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;tw+=dtr;
  if(dirty)build();
  if(running&&nets.length+comps.length){const sd=dtr*speed;const n=Math.min(600,Math.max(1,Math.ceil(sd/1e-4)));const h=sd/n;for(let i=0;i<n;i++)step(h);}
  else for(let i=0;i<nets.length;i++){Vn[i]=netVol(i);Pn[i]=nets[i].n/Vn[i];}
  for(let i=0;i<nets.length;i++){const p=Pn[i]-1;for(const k of nets[i].keys)portPg.set(k,p);}
  const kq=Math.min(1,dtr*8),ka=Math.min(1,dtr*18);
  for(const c of comps){const st=c.st;st.qs+=((running?st.q:0)-st.qs)*kq;if(st.anim!==undefined)st.anim+=(st.pos-st.anim)*ka;for(const k in st.ex)st.exs[k]=(st.exs[k]||0)+((running?st.ex[k]:0)-(st.exs[k]||0))*kq;}
  if(viewTarget){view.ox+=(viewTarget.ox-view.ox)*Math.min(1,dtr*10);view.oy+=(viewTarget.oy-view.oy)*Math.min(1,dtr*10);if(Math.abs(viewTarget.oy-view.oy)<0.5&&Math.abs(viewTarget.ox-view.ox)<0.5)viewTarget=null;}
  if(running)sampleGraph();
  if(W)render();
  if(graphOpen)drawGraph();
  if(now-roT>150){roT=now;updateRO();}
  requestAnimationFrame(frame);
}
if(!load())loadExample(EX[0]);else{dirty=true;}
record();
resize();fit();
requestAnimationFrame(frame);
})();
</script>
